name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
      - uses: gradle/actions/setup-gradle@v4
      # Testcontainers starts its own Postgres, so no service container here.
      - run: ./gradlew build
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
        working-directory: frontend
      - name: Production build
        run: npx ng build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start Postgres and Keycloak
        run: docker compose -f backend/docker-compose.yml up -d --wait

      - name: Start the API
        env:
          LEXSTORE_DEV_RESET: 'true'
          # Storing a provider key requires this; without it the API refuses,
          # which is the behaviour a deployment should have.
          LEXSTORE_SECRET_KEY: ci-encryption-key-not-a-real-secret
        run: |
          ./gradlew bootRun -x test &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/actuator/health || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "API did not start" && exit 1
        working-directory: backend

      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: End-to-end tests
        run: npx playwright test --grep-invert baseline
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
