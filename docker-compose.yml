# The whole stack, as it runs in a deployment. Secrets come from the
# environment (see .env.example); nothing sensitive is committed here.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lexstore
      POSTGRES_USER: ${DATABASE_USER:-lexstore}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-lexstore} -d lexstore"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start --import-realm --hostname-strict=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/lexstore
      KC_DB_USERNAME: ${DATABASE_USER:-lexstore}
      KC_DB_PASSWORD: ${DATABASE_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    volumes:
      # The production realm carries no seeded users and requires TLS; the
      # development one (realm-lexstore.json) is deliberately not mounted here.
      - ./backend/keycloak/realm-lexstore.prod.json:/opt/keycloak/data/import/realm.json:ro
      - ./backend/keycloak/themes/lexstore:/opt/keycloak/themes/lexstore:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${KEYCLOAK_PORT:-8089}:8080"
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/lexstore
      DATABASE_USER: ${DATABASE_USER:-lexstore}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:?set KEYCLOAK_ISSUER}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      API_ORIGIN: http://backend:8088
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  pgdata:
