services:
  postgres:
    image: postgres:17-alpine
    container_name: translad-postgres
    environment:
      POSTGRES_DB: translad
      POSTGRES_USER: translad
      POSTGRES_PASSWORD: translad
    ports:
      - "5432:5432"
    volumes:
      - translad-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translad -d translad"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  translad-pgdata:
