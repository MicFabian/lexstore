services:
  postgres:
    image: postgres:17-alpine
    container_name: lexstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lexstore
      POSTGRES_USER: lexstore
      POSTGRES_PASSWORD: lexstore
    ports:
      # Host port 5442: 5432 is commonly taken by other local Postgres instances.
      - "5442:5432"
    volumes:
      - lexstore-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexstore -d lexstore"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: lexstore-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8089
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8089:8089"
    volumes:
      - ./keycloak/realm-lexstore.json:/opt/keycloak/data/import/realm-lexstore.json:ro
      - ./keycloak/themes/lexstore:/opt/keycloak/themes/lexstore:ro
    healthcheck:
      # KC 26 has no curl/wget; probe the realm's OIDC config over bash /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8089 &&
          printf 'GET /realms/lexstore/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  lexstore-pgdata:
