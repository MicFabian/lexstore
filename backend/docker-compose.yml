services:
  postgres:
    image: postgres:17-alpine
    container_name: translad-postgres
    environment:
      POSTGRES_DB: translad
      POSTGRES_USER: translad
      POSTGRES_PASSWORD: translad
    ports:
      - "5432:5432"
    volumes:
      - translad-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translad -d translad"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: translad-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8089
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8089:8089"
    volumes:
      - ./keycloak/realm-translad.json:/opt/keycloak/data/import/realm-translad.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8089 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  translad-pgdata:
