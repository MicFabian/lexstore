services:
  postgres:
    image: postgres:17-alpine
    container_name: translad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: translad
      POSTGRES_USER: translad
      POSTGRES_PASSWORD: translad
    ports:
      - "5432:5432"
    volumes:
      - translad-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translad -d translad"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: translad-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8089
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8089:8089"
    volumes:
      - ./keycloak/realm-translad.json:/opt/keycloak/data/import/realm-translad.json:ro
    healthcheck:
      # KC 26 has no curl/wget; probe the realm's OIDC config over bash /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8089 &&
          printf 'GET /realms/translad/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  translad-pgdata:
