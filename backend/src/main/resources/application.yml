spring:
  application:
    name: translad
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8089/realms/translad}
  datasource:
    url: jdbc:postgresql://localhost:5432/translad
    username: translad
    password: translad
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    # Allow Flyway clean so the dev-reset endpoint can wipe + reseed. The endpoint
    # itself is still gated by translad.dev-reset below, so prod stays safe.
    clean-disabled: false

# Local-dev convenience: gate POST /api/dev/reset (off by default).
translad:
  dev-reset: ${TRANSLAD_DEV_RESET:false}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  base-url: https://api.anthropic.com

server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: health,info
