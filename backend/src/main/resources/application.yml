spring:
  application:
    name: translad
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  datasource:
    url: jdbc:postgresql://localhost:5432/translad
    username: translad
    password: translad
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  base-url: https://api.anthropic.com

server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: health,info
