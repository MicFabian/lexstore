spring:
  application:
    name: lexstore
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8089/realms/lexstore}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5442/lexstore?socketTimeout=30&loginTimeout=10}
    username: ${DATABASE_USER:lexstore}
    password: ${DATABASE_PASSWORD:lexstore}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 10000
      # A connection the database has silently dropped otherwise occupies a
      # request thread until the socket notices.
      validation-timeout: 3000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # Bulk paths (import, POEditor) insert thousands of rows; without
        # batching each one is its own round trip.
        jdbc:
          batch_size: 200
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    # No baseline-on-migrate: a non-empty schema must fail loudly instead of
    # silently skipping V1 — that is exactly how a shared database would break.
    # Demo data is a separate location so a real deployment never loads it;
    # the prod profile drops it and keeps only the schema.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
    # Clean stays disabled unless a deployment explicitly opts in; the prod
    # profile pins it shut so no configuration mistake can enable it.
    clean-disabled: ${FLYWAY_CLEAN_DISABLED:false}

# Local-dev convenience: gate POST /api/dev/reset (off by default).
lexstore:
  # Encrypts stored provider keys. Without it, keys cannot be saved through the
  # UI and the app falls back to the environment-supplied ones.
  secret-key: ${LEXSTORE_SECRET_KEY:}
  retention:
    # The AI request log records every translation with its text. Nothing else
    # removes those rows, so they are pruned on a schedule; 0 keeps them.
    request-log-days: ${LEXSTORE_REQUEST_LOG_DAYS:90}
    cron: ${LEXSTORE_RETENTION_CRON:0 30 3 * * *}
  agent:
    # The platform's own provider key, used by organisations on an agent plan.
    anthropic-key: ${LEXSTORE_AGENT_KEY:}
  dev-reset: ${LEXSTORE_DEV_RESET:false}
  # Browser origins allowed to call this API. Localhost only by default.
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  base-url: https://api.anthropic.com

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: https://api.openai.com

gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: https://generativelanguage.googleapis.com

server:
  port: 8088
  # In-flight requests get 20 seconds to finish before the process exits, so a
  # rolling deploy never cuts a save in half.
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/plain
    # The editor ships one row per term; below a couple of KB the round trip
    # costs more than the bytes saved.
    min-response-size: 2KB
  # A request larger than this is never legitimate here; the biggest payload is
  # a project image, capped well below it.
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 2MB
    max-http-form-post-size: 2MB
    # Caps the request body itself, which the form/header limits above do not:
    # without it a chunked upload is bounded only by heap.
    max-part-count: 32
    max-part-header-size: 8KB

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
# Production profile: every convenience that only makes sense on a laptop is
# off, and anything environment-specific must be supplied explicitly.
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    clean-disabled: true
    locations: classpath:db/migration
  jpa:
    properties:
      hibernate:
        format_sql: false

lexstore:
  dev-reset: false

logging:
  level:
    org.hibernate.SQL: warn
